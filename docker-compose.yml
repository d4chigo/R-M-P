
services:
  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: rmp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # No exponemos puertos a la red pública. Solo es accesible desde la red de Docker.
    ports: []
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - rmp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # phpMyAdmin para administrar la base de datos
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: rmp_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # No exponemos puertos por seguridad en producción.
    ports: []
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rmp_network

  # Servidor backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rmp_server
    restart: always
    env_file:
      - .env
    ports:
      # Exponemos el puerto solo para que Nginx lo pueda alcanzar.
      - "${SERVER_PORT:-4000}:${SERVER_PORT:-4000}"
    depends_on:
      mysql:
        condition: service_healthy
    volumes: []
    networks:
      - rmp_network

  # Cliente frontend (Next.js)
  client:
    build:
      context: ./client
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      dockerfile: Dockerfile
    container_name: rmp_client
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PORT: ${CLIENT_PORT}
    ports:
      # Exponemos el puerto para que Nginx lo pueda alcanzar.
      - "${CLIENT_PORT}:${CLIENT_PORT}"
    depends_on:
      - server
    volumes: []
    networks:
      - rmp_network

  # Proxy reverso con SSL (Nginx Proxy Manager)
  nginx-proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: rmp_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${NPM_PORT:-81}:81"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - nginx_data:/data
      - nginx_letsencrypt:/etc/letsencrypt
    networks:
      - rmp_network

volumes:
  mysql_data:
  nginx_data:
  nginx_letsencrypt:

networks:
  rmp_network:
    driver: bridge

